<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kromskii - Mabar VIP Ticker</title>
<style>
  :root {
    --cyan: #49f4ff;
    --blue: #4d7cff;
    --purple: #b14cff;
    --white: #f7fbff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  body {
    font-family: "Arial", "Segoe UI", sans-serif;
    color: var(--white);
  }

  /* Full-width bottom banner; page background remains transparent. */
  .ticker-shell {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 28px;
    height: 58px;
    display: flex;
    align-items: center;
    overflow: hidden;
    background: linear-gradient(90deg,
      rgba(8, 13, 39, 0.94),
      rgba(22, 12, 54, 0.94) 52%,
      rgba(8, 13, 39, 0.94));
    border-top: 2px solid rgba(73, 244, 255, 0.95);
    border-bottom: 2px solid rgba(177, 76, 255, 0.95);
    box-shadow:
      0 -5px 24px rgba(73, 244, 255, 0.16),
      0 5px 28px rgba(177, 76, 255, 0.24);
  }

  .ticker-shell::before,
  .ticker-shell::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    width: 70px;
    z-index: 2;
    pointer-events: none;
  }

  .ticker-shell::before {
    left: 0;
    background: linear-gradient(90deg, rgba(8, 13, 39, 0.98), transparent);
  }

  .ticker-shell::after {
    right: 0;
    background: linear-gradient(270deg, rgba(8, 13, 39, 0.98), transparent);
  }

  .ticker-track {
    display: flex;
    align-items: center;
    width: max-content;
    white-space: nowrap;
    will-change: transform;
    animation: scroll-left 42s linear infinite;
  }

  .ticker-group {
    display: inline-flex;
    align-items: center;
    gap: 30px;
    padding-right: 30px;
    flex-shrink: 0;
  }

  .heading {
    font-size: 21px;
    font-weight: 900;
    letter-spacing: 1.8px;
    color: var(--cyan);
    text-shadow:
      0 0 6px rgba(73, 244, 255, 0.95),
      0 0 18px rgba(73, 244, 255, 0.65);
  }

  .item {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 0.3px;
    color: var(--white);
    text-shadow:
      0 0 5px rgba(255, 255, 255, 0.3),
      0 0 14px rgba(77, 124, 255, 0.4);
  }

  .price {
    color: #d7a6ff;
    text-shadow:
      0 0 7px rgba(177, 76, 255, 0.95),
      0 0 17px rgba(177, 76, 255, 0.55);
  }

  .separator {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--cyan);
    box-shadow: 0 0 10px var(--cyan), 0 0 20px var(--purple);
  }

  @keyframes scroll-left {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  /* Set a readable medium speed. Change 42s to a larger number for slower movement. */
  @media (prefers-reduced-motion: reduce) {
    .ticker-track { animation-duration: 70s; }
  }
</style>
</head>
<body>
  <div class="ticker-shell" aria-label="Mabar VIP and request prices">
    <div class="ticker-track">
      <div class="ticker-group">
        <span class="heading">MABAR VIP:</span>
        <span class="item">VIP: permatch <span class="price">5k.</span></span>
        <span class="separator"></span>
        <span class="item">VIP: End Stream <span class="price">50k.</span></span>
        <span class="separator"></span>
        <span class="heading">REQUEST:</span>
        <span class="item">CMD: <span class="price">50k.</span></span>
        <span class="separator"></span>
        <span class="item">999: <span class="price">100k.</span></span>
        <span class="separator"></span>
        <span class="item">ultra: <span class="price">150k.</span></span>
        <span class="separator"></span>
        <span class="item">Surend: <span class="price">150k.</span></span>
        <span class="separator"></span>
      </div>
      <!-- Exact duplicate makes the scrolling loop seamless. -->
      <div class="ticker-group" aria-hidden="true">
        <span class="heading">MABAR VIP:</span>
        <span class="item">VIP: permatch <span class="price">5k.</span></span>
        <span class="separator"></span>
        <span class="item">VIP: End Stream <span class="price">50k.</span></span>
        <span class="separator"></span>
        <span class="heading">REQUEST:</span>
        <span class="item">CMD: <span class="price">50k.</span></span>
        <span class="separator"></span>
        <span class="item">999: <span class="price">100k.</span></span>
        <span class="separator"></span>
        <span class="item">ultra: <span class="price">150k.</span></span>
        <span class="separator"></span>
        <span class="item">Surend: <span class="price">150k.</span></span>
        <span class="separator"></span>
      </div>
    </div>
  </div>
</body>
</html>
